<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>니업마인더</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- 한글 폰트(Noto Sans KR, Noto Serif KR)가 추가된 폰트 링크 -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17352f;
      --muted: #6d7f7a;
      --paper: #f5f7f3;
      --surface: #ffffff;
      --line: #dce6e0;
      --accent: #126e5a;
      --accent-soft: #d9f1e9;
      --danger: #bd3d48;
      --shadow: 0 18px 45px rgba(21, 64, 53, 0.10);
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      /* 기본 한글 폰트 추가 및 글꼴 부드럽게(안티앨리어싱) 처리 */
      font-family: "DM Sans", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--ink);
      background: var(--paper);
    }

    body.theme-night {
      --ink: #ffffff;
      --muted: #a0b2ad;
      --paper: #102a25;
      --surface: #173832;
      --line: #2c554b;
      --accent: #8edbc4;
      --accent-soft: #244c42;
      --danger: #ff9ba5;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.24);
    }

    body.theme-night .brand-mark,
    body.theme-night .brand-mark *,
    body.theme-night .alarm-pulse,
    body.theme-night .alarm-pulse * {
      color: #ffffff !important;
    }

    body.theme-mint {
      --ink: #17352f;
      --muted: #647a72;
      --paper: #e4f6ef;
      --surface: #fbfffd;
      --line: #cde7dc;
      --accent: #0d8064;
      --accent-soft: #c9f0df;
      --danger: #bd3d48;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      padding: 24px;
      background:
        radial-gradient(circle at 85% 4%, rgba(99, 190, 157, 0.20), transparent 24rem),
        radial-gradient(circle at 5% 90%, rgba(129, 194, 177, 0.16), transparent 25rem);
    }

    .app-frame { max-width: 1120px; margin: 0 auto; }
    .brand-mark {
      width: 46px; height: 46px; border-radius: 15px;
      display: grid; place-items: center;
      color: #fff; background: var(--accent);
      box-shadow: 0 9px 18px rgba(18, 110, 90, 0.25);
    }

    /* 제목용 한글 폰트(Noto Serif KR) 매핑 */
    .display-font { font-family: "Fraunces", "Noto Serif KR", serif; }
    
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 24px;
    }

    .task-form input, .task-form select, .alarm-controls input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: transparent;
      color: var(--ink);
      padding: 0 14px;
      outline: none;
      font: inherit;
    }

    .task-form input:focus, .task-form select:focus, .alarm-controls input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(18, 110, 90, 0.15);
    }
    
    body.theme-night select option {
      background: var(--surface);
      color: var(--ink);
    }

    .action-button, .theme-button, .icon-button {
      transition: transform .18s ease, filter .18s ease, background .18s ease;
    }
    .action-button:hover, .theme-button:hover, .icon-button:hover { transform: translateY(-2px); filter: brightness(.98); }
    .action-button:focus-visible, .theme-button:focus-visible, .icon-button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(18, 110, 90, .38);
      outline-offset: 2px;
    }

    .task-card { border-left: 4px solid var(--accent); }
    .task-card.is-completed { opacity: .62; border-left-color: var(--muted); }
    .task-card.is-completed .task-title-text { text-decoration: line-through; }

    .check-control {
      width: 24px; height: 24px; flex: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .theme-button.active {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-dot {
      display: inline-block;
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.8);
    }

    .alarm-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      background: rgba(7, 28, 23, .72);
      backdrop-filter: blur(8px);
      padding: 24px;
    }
    .alarm-overlay.show { display: flex; animation: appear .3s ease-out; }
    .alarm-card {
      width: min(100%, 420px);
      text-align: center;
      padding: 42px 28px;
      border-radius: 30px;
      color: #17352f;
      background: #f9fffc;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }
    
    body.theme-night .alarm-card {
      color: #ffffff;
      background: var(--surface);
    }

    .alarm-pulse {
      width: 82px; height: 82px; border-radius: 50%;
      margin: 0 auto 22px; display: grid; place-items: center;
      color: #fff; background: #126e5a;
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse { 50% { transform: scale(1.11); box-shadow: 0 0 0 16px rgba(18,110,90,.16); } }
    @keyframes appear { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 640px) {
      .app-shell { padding: 15px; }
      .panel { border-radius: 20px; }
    }
  </style>
 </head>
 <body>
  <div class="app-shell">
   <div class="app-frame">
    <header class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between mb-7">
     <div class="flex items-center gap-3">
      <div class="brand-mark" aria-hidden="true"><i data-lucide="bell-ring" class="w-6 h-6"></i>
      </div>
      <div>
       <h1 class="display-font text-3xl leading-none m-0">니업마인더</h1>
       <p class="mt-2 mb-0 text-sm">나만의 스마트 기상 & 할 일 매니저</p>
      </div>
     </div>
     <div class="flex items-center gap-2 text-sm" style="color: var(--muted);">
      <i data-lucide="calendar-days" class="w-4 h-4" aria-hidden="true"></i> <span id="today-label" aria-live="polite"></span>
     </div>
    </header>
    <main>
     <section class="grid lg:grid-cols-[1.45fr_.85fr] gap-6">
      <div class="space-y-6">
       <section class="panel p-5 sm:p-7">
        <div class="flex items-start justify-between gap-4 mb-5">
         <div>
          <p class="text-xs font-bold tracking-widest uppercase m-0">New Task</p>
          <h2 class="display-font text-2xl mt-2 mb-0">새로운 할 일 추가</h2>
         </div>
         <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--accent-soft); color: var(--accent);">
          <i data-lucide="plus" class="w-5 h-5" aria-hidden="true"></i>
         </div>
        </div>
        <form id="task-form" class="task-form grid sm:grid-cols-2 gap-4">
         <div class="sm:col-span-2">
          <label class="block text-sm font-semibold mb-2" for="task-title">할 일 내용</label> 
          <input id="task-title" type="text" maxlength="100" placeholder="기억할 일을 입력하세요" required>
         </div>
         <div>
          <label class="block text-sm font-semibold mb-2" for="task-type">카테고리</label> 
          <select id="task-type"> 
            <option value="할 일">할 일</option> 
            <option value="약속">약속</option> 
            <option value="중요">중요</option> 
          </select>
         </div>
         <div>
          <label class="block text-sm font-semibold mb-2" for="task-time">리마인더 시간</label> 
          <input id="task-time" type="time">
         </div>
         <div class="sm:col-span-2 flex flex-col sm:flex-row sm:items-center gap-3 pt-1">
          <button class="action-button w-full sm:w-auto min-h-12 px-5 rounded-xl font-bold inline-flex items-center justify-center gap-2" type="submit" style="background: var(--accent); color: white;"> 
            <i data-lucide="check" class="w-5 h-5" aria-hidden="true"></i> <span>저장하기</span> 
          </button>
          <p id="task-form-message" class="text-sm m-0" role="status" aria-live="polite" style="color: var(--muted);"></p>
         </div>
        </form>
       </section>
       <section aria-labelledby="task-list-heading">
        <div class="flex items-end justify-between px-1 mb-3">
         <div>
          <p class="text-xs font-bold tracking-widest uppercase m-0">My Tasks</p>
          <h2 id="task-list-heading" class="display-font text-2xl mt-2 mb-0">오늘의 할 일</h2>
         </div><span id="task-count" class="text-sm font-semibold" style="color: var(--muted);"></span>
        </div>
        <div id="empty-tasks" class="panel text-center p-10">
         <i data-lucide="coffee" class="w-7 h-7 mx-auto mb-3" style="color: var(--accent);" aria-hidden="true"></i>
         <p class="m-0">아직 등록된 할 일이 없어요.</p>
        </div>
        <div id="task-list" class="space-y-3"></div>
       </section>
      </div>
      <aside class="space-y-6">
       <section class="panel p-5 sm:p-6">
        <div class="flex items-center justify-between mb-5">
         <div>
          <p class="text-xs font-bold tracking-widest uppercase m-0">Wake Up</p>
          <h2 class="display-font text-2xl mt-2 mb-0">기상 알람</h2>
         </div><i data-lucide="alarm-clock" class="w-7 h-7" style="color: var(--accent);" aria-hidden="true"></i>
        </div>
        <div class="alarm-controls">
         <label class="block text-sm font-semibold mb-2" for="alarm-time">기상 시간 설정</label> 
         <input id="alarm-time" type="time" value="07:00">
        </div>
        <div class="grid grid-cols-2 gap-3 mt-4">
         <button id="alarm-on-button" class="action-button min-h-12 rounded-xl font-bold" type="button" style="background: var(--accent); color: white;">알람 켜기</button> 
         <button id="alarm-off-button" class="action-button min-h-12 rounded-xl font-bold border" type="button" style="border-color: var(--line); color: var(--ink); background: transparent;">알람 끄기</button>
        </div>
        <div id="alarm-status" class="mt-4 rounded-xl px-4 py-3 text-sm font-medium" role="status" aria-live="polite" style="background: var(--accent-soft); color: var(--accent);"></div>
        <p class="text-xs leading-relaxed mt-4 mb-0" style="color: var(--muted);">설정한 시간에 맞춰 맑고 기분 좋은 알람이 울립니다.</p>
       </section>
       <section class="panel p-5 sm:p-6">
        <div class="flex items-center gap-3 mb-4">
         <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: var(--accent-soft); color: var(--accent);">
          <i data-lucide="palette" class="w-5 h-5" aria-hidden="true"></i>
         </div>
         <div>
          <h2 class="text-lg font-bold m-0">화면 테마</h2>
          <p class="text-xs mt-1 mb-0" style="color: var(--muted);">원하는 컬러를 선택하세요</p>
         </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
         <button id="light-theme" class="theme-button rounded-xl px-2 py-3 text-xs font-bold flex flex-col items-center gap-2 border-0 bg-transparent cursor-pointer" type="button" style="color: var(--ink);"> 
           <span class="theme-dot" style="background:#f5f7f3;"></span> <span>라이트</span> 
         </button> 
         <button id="night-theme" class="theme-button rounded-xl px-2 py-3 text-xs font-bold flex flex-col items-center gap-2 border-0 bg-transparent cursor-pointer" type="button" style="color: var(--ink);"> 
           <span class="theme-dot" style="background:#173832;"></span> <span>나이트</span> 
         </button> 
         <button id="mint-theme" class="theme-button rounded-xl px-2 py-3 text-xs font-bold flex flex-col items-center gap-2 border-0 bg-transparent cursor-pointer" type="button" style="color: var(--ink);"> 
           <span class="theme-dot" style="background:#b9ead7;"></span> <span>민트</span> 
         </button>
        </div>
       </section>
       <!-- 꿀팁 영역이 명언 영역으로 수정된 부분 -->
       <section class="rounded-3xl p-5 border" style="border-color: var(--line); background: var(--accent-soft);">
        <div class="flex gap-3">
         <i data-lucide="quote" class="w-5 h-5 shrink-0 mt-0.5" style="color: var(--accent);" aria-hidden="true"></i>
         <div>
          <h2 class="text-sm font-bold mt-0 mb-1" style="color: var(--accent);">시간 명언</h2>
          <p id="quote-text" class="text-xs leading-relaxed m-0" style="color: var(--accent);"></p>
         </div>
        </div>
       </section>
      </aside>
     </section>
    </main>
    <footer class="mt-8 pb-2 text-center">
     <p class="text-xs m-0" style="color: var(--muted);">© 2026 니업마인더</p>
    </footer>
   </div>
  </div>
  
  <template id="task-template">
   <article class="task-card panel p-4 flex items-center gap-3">
    <input class="check-control" type="checkbox" aria-label="할 일 완료 처리">
    <div class="min-w-0 flex-1">
     <div class="flex flex-wrap items-center gap-2">
      <h3 class="task-title-text font-bold text-base m-0 truncate"></h3>
      <span class="task-type-text rounded-full px-2 py-0.5 text-xs font-bold border" style="border-color: var(--line);"></span>
     </div>
     <p class="mt-1 mb-0 text-xs flex items-center gap-1" style="color: var(--muted);">
       <i data-lucide="clock-3" class="w-3.5 h-3.5" aria-hidden="true"></i> 
       <span class="task-time-text"></span>
     </p>
    </div>
    <button class="icon-button w-10 h-10 rounded-xl border flex items-center justify-center bg-transparent cursor-pointer" style="border-color: var(--line); color: var(--danger);" type="button" aria-label="할 일 삭제"> 
      <i data-lucide="trash-2" class="w-4 h-4" aria-hidden="true"></i> 
    </button>
   </article>
  </template>

  <div id="alarm-overlay" class="alarm-overlay" role="dialog" aria-modal="true" aria-labelledby="ringing-title">
   <div class="alarm-card">
    <div class="alarm-pulse"><i data-lucide="bell-ring" class="w-9 h-9" aria-hidden="true"></i></div>
    <h2 id="ringing-title" class="display-font text-3xl mt-0 mb-3">일어날 시간이에요!</h2>
    <p class="mb-7">오늘 하루도 힘차게 시작해 볼까요?</p>
    <button id="stop-alarm-button" class="action-button px-7 min-h-12 rounded-xl font-bold cursor-pointer" type="button" style="background: var(--accent); color: white; border: none;">알람 끄기</button>
   </div>
  </div>
  
  <script>
    let records = JSON.parse(localStorage.getItem("nieop-tasks") || "[]");
    let alarmEnabled = false;
    let alarmTime = "";
    let lastTriggeredDate = "";
    let audioContext = null;
    let oscillator = null;
    let alarmInterval = null;

    const taskList = document.getElementById("task-list");
    const emptyTasks = document.getElementById("empty-tasks");
    const taskCount = document.getElementById("task-count");
    const message = document.getElementById("task-form-message");
    const alarmStatus = document.getElementById("alarm-status");

    // 시간 명언 리스트
    const timeQuotes = [
      "시간은 환상이다. - 알베르트 아인슈타인",
      "낭비한 시간에 대한 후회는 더 큰 시간 낭비이다. - 메이슨 쿨리",
      "우리가 가장 아껴야 할 것은 시간이다. - 테오프라스토스",
      "미래는 현재 우리가 무엇을 하는가에 달려 있다. - 마하트마 간디",
      "승자는 시간을 관리하고, 패자는 시간에 끌려간다. - J. 홉스",
      "가장 바쁜 사람이 가장 많은 시간을 갖는다. - 알렉산드르 피네",
      "시간을 지배할 줄 아는 사람은 인생을 지배할 줄 아는 사람이다. - 에센 바흐",
      "변명 중에서도 가장 어리석고 못난 변명은 시간이 없어서라는 변명이다. - 토마스 에디슨"
    ];

    function setRandomQuote() {
      const quoteText = document.getElementById("quote-text");
      const randomIndex = Math.floor(Math.random() * timeQuotes.length);
      quoteText.textContent = timeQuotes[randomIndex];
    }

    function saveRecords() {
      localStorage.setItem("nieop-tasks", JSON.stringify(records));
      renderTasks();
    }

    function setMessage(text, isError) {
      message.textContent = text;
      message.style.color = isError ? "var(--danger)" : "var(--accent)";
    }

    function renderTasks() {
      const sorted = [...records].sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.time || "99:99").localeCompare(b.time || "99:99");
      });

      const existing = new Map([...taskList.children].map(el => [el.dataset.recordId, el]));
      sorted.forEach(record => {
        let card = existing.get(record.__backendId);
        if (!card) {
          card = createTaskCard(record);
          taskList.appendChild(card);
        }
        updateTaskCard(card, record);
        existing.delete(record.__backendId);
      });
      existing.forEach(el => el.remove());

      emptyTasks.style.display = records.length ? "none" : "block";
      taskCount.textContent = records.length ? `${records.length}개의 리마인더` : "";
    }

    function createTaskCard(record) {
      const fragment = document.getElementById("task-template").content.cloneNode(true);
      const card = fragment.querySelector("article");
      card.dataset.recordId = record.__backendId;

      const checkbox = card.querySelector('input[type="checkbox"]');
      checkbox.addEventListener("change", () => {
        const target = records.find(item => item.__backendId === card.dataset.recordId);
        if (!target) return;
        target.completed = checkbox.checked;
        saveRecords();
      });

      const deleteButton = card.querySelector("button");
      deleteButton.addEventListener("click", () => {
        if (deleteButton.dataset.confirming !== "true") {
          deleteButton.dataset.confirming = "true";
          deleteButton.innerHTML = '<i data-lucide="check" class="w-4 h-4" aria-hidden="true"></i>';
          deleteButton.setAttribute("aria-label", "삭제 확인");
          lucide.createIcons();
          window.setTimeout(() => {
            if (deleteButton.dataset.confirming === "true") {
              deleteButton.dataset.confirming = "";
              deleteButton.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4" aria-hidden="true"></i>';
              deleteButton.setAttribute("aria-label", "할 일 삭제");
              lucide.createIcons();
            }
          }, 2500);
          return;
        }

        records = records.filter(item => item.__backendId !== card.dataset.recordId);
        saveRecords();
      });

      lucide.createIcons();
      return card;
    }

    function updateTaskCard(card, record) {
      card.classList.toggle("is-completed", Boolean(record.completed));
      card.querySelector('input[type="checkbox"]').checked = Boolean(record.completed);
      
      const titleEl = card.querySelector('.task-title-text');
      if(titleEl) titleEl.textContent = record.title;
      
      const typeEl = card.querySelector('.task-type-text');
      if(typeEl) typeEl.textContent = record.type || "할 일";
      
      const timeEl = card.querySelector('.task-time-text');
      if(timeEl) timeEl.textContent = record.time ? `${record.time} 리마인더` : "시간 미설정";
    }

    document.getElementById("task-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const titleInput = document.getElementById("task-title");
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      const title = titleInput.value.trim();

      if (!title) {
        setMessage("기억할 일을 한 줄로 적어 주세요.", true);
        titleInput.focus();
        return;
      }
      if (records.length >= 999) {
        setMessage("최대 999개의 리마인더까지 저장할 수 있어요.", true);
        return;
      }

      submitButton.disabled = true;

      const newTask = {
        __backendId: Date.now().toString(),
        title,
        type: document.getElementById("task-type").value,
        time: document.getElementById("task-time").value,
        completed: false,
        created_at: new Date().toISOString()
      };

      records.push(newTask);
      saveRecords();

      event.currentTarget.reset();
      setMessage("리마인더를 저장했어요.", false);
      submitButton.disabled = false;
    });

    function updateAlarmStatus() {
      if (alarmEnabled && alarmTime) {
        alarmStatus.textContent = `${alarmTime}에 알람이 울리도록 설정됐어요.`;
      } else {
        alarmStatus.textContent = "현재 설정된 기상 알람이 없어요.";
      }
    }

    function startAlarmSound() {
      stopAlarmSound();
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const playTone = () => {
        if (!audioContext) return;
        oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.setValueAtTime(740, audioContext.currentTime);
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, audioContext.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.42);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.45);
      };
      playTone();
      alarmInterval = window.setInterval(playTone, 900);
    }

    function stopAlarmSound() {
      if (alarmInterval) window.clearInterval(alarmInterval);
      alarmInterval = null;
      if (oscillator) oscillator.stop();
      oscillator = null;
      if (audioContext) audioContext.close();
      audioContext = null;
    }

    function triggerAlarm() {
      startAlarmSound();
      document.getElementById("alarm-overlay").classList.add("show");
    }

    function checkAlarm() {
      if (!alarmEnabled || !alarmTime) return;
      const now = new Date();
      const currentTime = now.toTimeString().slice(0, 5);
      const today = now.toISOString().slice(0, 10);
      if (currentTime === alarmTime && lastTriggeredDate !== today) {
        lastTriggeredDate = today;
        triggerAlarm();
      }
    }

    document.getElementById("alarm-on-button").addEventListener("click", () => {
      alarmTime = document.getElementById("alarm-time").value;
      if (!alarmTime) {
        alarmStatus.textContent = "먼저 원하는 기상 시간을 선택해 주세요.";
        return;
      }
      alarmEnabled = true;
      updateAlarmStatus();
    });

    document.getElementById("alarm-off-button").addEventListener("click", () => {
      alarmEnabled = false;
      stopAlarmSound();
      document.getElementById("alarm-overlay").classList.remove("show");
      updateAlarmStatus();
    });

    document.getElementById("stop-alarm-button").addEventListener("click", () => {
      stopAlarmSound();
      document.getElementById("alarm-overlay").classList.remove("show");
    });

    function setTheme(theme) {
      document.body.classList.remove("theme-night", "theme-mint");
      if (theme === "night") document.body.classList.add("theme-night");
      if (theme === "mint") document.body.classList.add("theme-mint");
      document.querySelectorAll(".theme-button").forEach(button => button.classList.remove("active"));
      document.getElementById(`${theme}-theme`).classList.add("active");
      sessionStorage.setItem("nieop-theme", theme);
    }

    ["light", "night", "mint"].forEach(theme => {
      document.getElementById(`${theme}-theme`).addEventListener("click", () => setTheme(theme));
    });

    function initialize() {
      const now = new Date();
      document.getElementById("today-label").textContent = now.toLocaleDateString("ko-KR", {
        month: "long", day: "numeric", weekday: "short"
      });
      setTheme(sessionStorage.getItem("nieop-theme") || "light");
      updateAlarmStatus();
      
      // 랜덤 명언 설정
      setRandomQuote();
      
      lucide.createIcons();
      renderTasks();
      window.setInterval(checkAlarm, 1000);
    }

    initialize();
  </script>
 </body>
</html>
